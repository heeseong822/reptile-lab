<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>개체노트</title>
    <link rel ="stylesheet" href ="style.css"
</head>
<body>
<header class="top">
  <h1>개체노트</h1>
  <p>6마리 · 확인 필요 3</p>
</header>

<main>
  <section class="grid">
    <article class="card">
      <div class="card-top">
        <h2>모찌</h2>
        <span class="badge">암</span>
      </div>
      <p class="species">레오파드 게코 · 마크 스노우</p>
      <p class="stats">48g · 3일 전 급여</p>
    </article>
    <article class="card alert">
      <div class="card-top">
        <h2>크림</h2>
        <span class="badge">수</span>
      </div>
      <p class="species">크레스티드 게코 · 할리퀸</p>
      <p class="stats">36g · 11일 전 급여</p>
    </article>
    <article class="card alert">
      <div class="card-top">
        <h2>탄이</h2>
        <span class="badge">수</span>
      </div>
      <p class="species">볼파이톤 · 파스텔</p>
      <p class="stats">1250g · 16일 전 급여</p>
    </article>
    <article class="card">
      <div class="card-top">
        <h2>라떼</h2>
        <span class="badge">암</span>
      </div>
      <p class="species">레오파드 게코 · 탠져린</p>
      <p class="stats">22g · 2일 전 급여</p>
    </article>
    <article class="card">
      <div class="card-top">
        <h2>호두</h2>
        <span class="badge">미구분</span>
      </div>
      <p class="species">크레스티드 게코 · 달마시안</p>
      <p class="stats">4g · 3일 전 급여</p>
    </article>
    <article class="card alert">
      <div class="card-top">
        <h2>솔</h2>
        <span class="badge">암</span>
      </div>
      <p class="species">볼파이톤 · 노멀</p>
      <p class="stats">1680g · 22일 전 급여</p>
    </article>
  </section>
</main>
</body>
</html>
